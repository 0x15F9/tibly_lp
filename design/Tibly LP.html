document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:relative;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%, #EEF2F9 0%, #F7F8FA 55%);\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:76px 32px 64px;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;\">\n    <div>\n      <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E5EA;color:#1A366B;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;box-shadow:0 1px 2px rgba(10,24,57,.05);letter-spacing:.01em;\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#2C8A5C;\"><\u002Fspan>\n        Cardiology-focused clinical platform\n      <\u002Fdiv>\n      <h1 data-reveal=\"\" style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.015em;color:#0F2557;margin:22px 0 0;text-wrap:balance;\">\n        Less paperwork.<br>More time with patients.\n      <\u002Fh1>\n      <p data-reveal=\"\" style=\"font-size:18px;line-height:1.6;color:#5A6372;margin:22px 0 0;max-width:520px;\">\n        Tibly takes your specialist practice from patient intake to consultation notes, prescriptions and professional documents — in one fast, private workflow that already knows your medicines, phrasing and templates.\n      <\u002Fp>\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;\">\n        <a href=\"#demo\" style=\"display:inline-flex;align-items:center;gap:8px;background:#1F7A4D;color:#fff;font-size:15px;font-weight:600;padding:14px 24px;border-radius:8px;box-shadow:0 4px 12px rgba(31,122,77,.24);transition:transform .2s,background .2s;\" style-hover=\"background:#186040;color:#fff;transform:translateY(-1px);\">\n          Book a demo\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#how\" style=\"display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0F2557;font-size:15px;font-weight:600;padding:14px 24px;border-radius:8px;border:1px solid #CDD2DA;transition:border-color .2s,color .2s;\" style-hover=\"border-color:#0F2557;color:#0F2557;\">\n          See how it works\n        <\u002Fa>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:14px;margin-top:30px;color:#7C8492;font-size:13px;\">\n        <div style=\"display:flex;align-items:center;gap:7px;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F7A4D\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Private &amp; login-only<\u002Fdiv>\n        <div style=\"width:1px;height:14px;background:#CDD2DA;\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F7A4D\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Built for specialists<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"position:relative;\">\n      <div style=\"position:absolute;inset:-18px -18px auto auto;width:140px;height:140px;border-radius:20px;background:linear-gradient(135deg,#D2EADD,transparent);filter:blur(6px);opacity:.7;z-index:0;\"><\u002Fdiv>\n      <div style=\"position:relative;z-index:1;border-radius:16px;background:#fff;border:1px solid #E2E5EA;box-shadow:0 24px 60px rgba(10,24,57,.16);overflow:hidden;\">\n        <div style=\"height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #EFF1F4;background:#FBFCFD;\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#E2E5EA;\"><\u002Fspan>\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#E2E5EA;\"><\u002Fspan>\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#E2E5EA;\"><\u002Fspan>\n          <span style=\"margin-left:12px;font-size:11px;color:#A8AFBB;font-family:'IBM Plex Mono',monospace;\">app.tibly.net<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:16/11;\">\n          <image-slot id=\"hero-dashboard\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop your Tibly dashboard screenshot\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TRUST STRIP ============ -->\n<section style=\"border-top:1px solid #EFF1F4;border-bottom:1px solid #EFF1F4;background:#fff;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:26px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;\">\n    <span data-reveal=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A8AFBB;\">One workflow, from intake to documents<\u002Fspan>\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:40px;\">\n      <div><div style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:26px;color:#0F2557;\">4<\u002Fdiv><div style=\"font-size:12.5px;color:#7C8492;margin-top:2px;\">core modules<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:26px;color:#0F2557;\">6+<\u002Fdiv><div style=\"font-size:12.5px;color:#7C8492;margin-top:2px;\">document types<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:26px;color:#0F2557;\">1<\u002Fdiv><div style=\"font-size:12.5px;color:#7C8492;margin-top:2px;\">record per patient<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:26px;color:#0F2557;\">Minutes<\u002Fdiv><div style=\"font-size:12.5px;color:#7C8492;margin-top:2px;\">to a finished visit<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOUR PILLARS ============ -->\n<section id=\"product\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px 40px;\">\n  <div style=\"max-width:660px;\">\n    <div data-reveal=\"\" style=\"font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A4D;\">The platform<\u002Fdiv>\n    <h2 data-reveal=\"\" style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em;color:#0F2557;margin:14px 0 0;\">Four pillars, one continuous record<\u002Fh2>\n    <p data-reveal=\"\" style=\"font-size:17px;line-height:1.6;color:#5A6372;margin:16px 0 0;\">Everything a specialist practice touches in a visit — patients, history, consultation and paperwork — lives in a single, connected flow.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:44px;\">\n    <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid #E2E5EA;border-radius:14px;padding:30px;box-shadow:0 1px 2px rgba(10,24,57,.05);transition:box-shadow .25s,transform .25s;\" style-hover=\"box-shadow:0 14px 34px rgba(10,24,57,.12);transform:translateY(-3px);\">\n        <div style=\"width:46px;height:46px;border-radius:11px;background:#EAF5EF;display:flex;align-items:center;justify-content:center;color:#1F7A4D;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ p.icon }}\"><\u002Fdiv>\n        <h3 style=\"font-family:'Inter',sans-serif;font-weight:600;font-size:19px;color:#0F2557;margin:18px 0 0;letter-spacing:-.01em;\">{{ p.title }}<\u002Fh3>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#5A6372;margin:9px 0 18px;\">{{ p.body }}<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;\">\n          <sc-for list=\"{{ p.points }}\" as=\"pt\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:#434B58;line-height:1.45;\">\n              <svg style=\"flex:none;margin-top:2px;\" width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2C8A5C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n              {{ pt }}\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SHOWCASE (consultation workspace) ============ -->\n<section style=\"max-width:1200px;margin:0 auto;padding:56px 32px;\">\n  <div data-reveal=\"\" style=\"background:#0F2557;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1.05fr;gap:0;align-items:stretch;box-shadow:0 24px 60px rgba(10,24,57,.22);\">\n    <div style=\"padding:56px 48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#74BC96;\">Consultation workspace<\u002Fdiv>\n      <h3 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:34px;line-height:1.12;color:#fff;margin:14px 0 0;\">A visit that writes<br>itself as you work<\u002Fh3>\n      <p style=\"font-size:16px;line-height:1.65;color:#B9C9E4;margin:16px 0 26px;\">Record the complaint, examination findings and vitals, build the plan and set the next review — with reusable favorites, defaults, drag-and-drop ordering and prefill from the last visit doing the repetitive typing for you.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n        <span style=\"font-size:12.5px;font-weight:500;color:#DBE4F2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;\">ECG &amp; echo findings<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:500;color:#DBE4F2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;\">Vitals capture<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:500;color:#DBE4F2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;\">Reusable favorites<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:500;color:#DBE4F2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;\">Next-review scheduling<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:32px 32px 0;display:flex;align-items:flex-end;\">\n      <div style=\"width:100%;border-radius:14px 14px 0 0;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-bottom:none;background:#fff;box-shadow:0 -8px 40px rgba(0,0,0,.2);\">\n        <div style=\"aspect-ratio:16/12;\">\n          <image-slot id=\"showcase-consult\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop the consultation workspace screenshot\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOW IT WORKS ============ -->\n<section id=\"how\" style=\"background:#fff;border-top:1px solid #EFF1F4;border-bottom:1px solid #EFF1F4;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;\">\n    <div data-reveal=\"\" style=\"text-align:center;max-width:620px;margin:0 auto;\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A4D;\">How it works<\u002Fdiv>\n      <h2 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em;color:#0F2557;margin:14px 0 0;\">Three steps from door to document<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px;\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" style=\"position:relative;background:#F7F8FA;border:1px solid #EFF1F4;border-radius:16px;padding:34px 30px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;\">\n            <span style=\"width:44px;height:44px;flex:none;border-radius:12px;background:#0F2557;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',serif;font-weight:700;font-size:21px;\">{{ s.n }}<\u002Fspan>\n            <div style=\"height:1px;flex:1;background:linear-gradient(90deg,#CDD2DA,transparent);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Inter',sans-serif;font-weight:600;font-size:19px;color:#0F2557;margin:22px 0 0;\">{{ s.title }}<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#5A6372;margin:9px 0 0;\">{{ s.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ WHO IT'S FOR ============ -->\n<section id=\"doctors\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px;\">\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;\">\n    <div data-reveal=\"\" style=\"order:1;\">\n      <div style=\"border-radius:16px;overflow:hidden;border:1px solid #E2E5EA;box-shadow:0 20px 50px rgba(10,24,57,.14);background:#fff;\">\n        <div style=\"aspect-ratio:4/3;\">\n          <image-slot id=\"doctors-shot\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a patient-profile or prescriptions screenshot\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"order:2;\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A4D;\">Built around your practice<\u002Fdiv>\n      <h2 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:38px;line-height:1.12;letter-spacing:-.01em;color:#0F2557;margin:14px 0 0;\">A tool that already knows how you work<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#5A6372;margin:16px 0 28px;\">Whether you run solo or with a small team, Tibly bends to your practice — your medicine lists, your medical-history options, your visit reasons, your document layouts. Set it up once; it does the repeating.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:20px;\">\n        <sc-for list=\"{{ benefits }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:15px;align-items:flex-start;\">\n            <span style=\"width:38px;height:38px;flex:none;border-radius:10px;background:#EAF5EF;display:flex;align-items:center;justify-content:center;color:#1F7A4D;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ b.icon }}\"><\u002Fspan>\n            <div>\n              <div style=\"font-weight:600;font-size:15.5px;color:#0F2557;\">{{ b.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:#5A6372;margin-top:3px;\">{{ b.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TESTIMONIAL ============ -->\n<section style=\"background:#EEF2F9;border-top:1px solid #E2E5EA;\">\n  <div style=\"max-width:900px;margin:0 auto;padding:88px 32px;text-align:center;\">\n    <div data-reveal=\"\">\n      <svg width=\"42\" height=\"42\" sc-camel-view-box=\"0 0 24 24\" fill=\"#B9C9E4\" style=\"margin:0 auto;\"><path d=\"M9.5 8C7 8 5 10 5 12.5S7 17 9.5 17c.3 0 .6 0 .9-.1C9.6 18.7 8 20 6 20.5c-.4.1-.6.5-.5.9.1.4.5.6.9.5C10.9 20.7 14 16.6 14 12c0-2.2-2-4-4.5-4zm9 0C16 8 14 10 14 12.5S16 17 18.5 17c.3 0 .6 0 .9-.1-.8 1.8-2.4 3.1-4.4 3.6-.4.1-.6.5-.5.9.1.4.5.6.9.5C19.9 20.7 23 16.6 23 12c0-2.2-2-4-4.5-4z\"><\u002Fpath><\u002Fsvg>\n      <p style=\"font-family:'EB Garamond',serif;font-weight:600;font-size:29px;line-height:1.35;color:#0F2557;margin:26px 0 0;text-wrap:balance;\">{{ testimonial.quote }}<\u002Fp>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-top:32px;\">\n        <div style=\"width:52px;height:52px;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(10,24,57,.14);\">\n          <image-slot id=\"testimonial-avatar\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"text-align:left;\">\n          <div style=\"font-weight:600;font-size:15px;color:#0F2557;\">{{ testimonial.name }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5A6372;\">{{ testimonial.role }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section id=\"faq\" style=\"max-width:820px;margin:0 auto;padding:96px 32px;\">\n  <div data-reveal=\"\" style=\"text-align:center;margin-bottom:44px;\">\n    <div style=\"font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A4D;\">FAQ<\u002Fdiv>\n    <h2 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em;color:#0F2557;margin:14px 0 0;\">Questions, answered<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:12px;\">\n    <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid #E2E5EA;border-radius:12px;overflow:hidden;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;background:none;border:none;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;\">\n          <span style=\"font-weight:600;font-size:16px;color:#0F2557;\">{{ f.q }}<\u002Fspan>\n          <span style=\"{{ f.iconStyle }}\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F7A4D\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <div style=\"{{ f.panelStyle }}\">\n          <div style=\"padding:0 22px 20px;font-size:14.5px;line-height:1.65;color:#5A6372;\">{{ f.a }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DEMO FORM CTA ============ -->\n<section id=\"demo\" style=\"background:linear-gradient(160deg,#0F2557 0%,#0A1839 100%);\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:92px 32px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;\">\n    <div data-reveal=\"\">\n      <h2 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:42px;line-height:1.1;letter-spacing:-.01em;color:#fff;margin:0;\">See Tibly on your own patients<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.65;color:#B9C9E4;margin:18px 0 30px;\">Book a short, private walkthrough. We'll set it up around your medicines, phrasing and documents, and show a full visit come together in a few clicks.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;align-items:center;gap:12px;color:#DBE4F2;font-size:15px;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74BC96\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>A 20-minute tailored walkthrough<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;color:#DBE4F2;font-size:15px;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74BC96\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>No commitment, no card<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;color:#DBE4F2;font-size:15px;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74BC96\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Your data stays private &amp; login-only<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 60px rgba(0,0,0,.3);\">\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:26px 8px;\">\n          <div style=\"width:60px;height:60px;border-radius:999px;background:#EAF5EF;display:flex;align-items:center;justify-content:center;margin:0 auto;\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F7A4D\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:24px;color:#0F2557;margin:20px 0 0;\">Thank you — request received<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:#5A6372;margin:10px 0 0;\">We'll be in touch shortly to arrange your walkthrough.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <h3 style=\"font-family:'Inter',sans-serif;font-weight:600;font-size:20px;color:#0F2557;margin:0 0 4px;\">Book a demo<\u002Fh3>\n          <p style=\"font-size:13.5px;color:#7C8492;margin:0 0 22px;\">We usually reply within a working day.<\u002Fp>\n          <form sc-camel-on-submit=\"{{ onSubmit }}\">\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#434B58;margin-bottom:6px;\">Name<\u002Flabel>\n            <input value=\"{{ fName }}\" sc-camel-on-change=\"{{ setName }}\" type=\"text\" placeholder=\"Dr. Full Name\" style=\"width:100%;font-family:'Inter',sans-serif;font-size:14.5px;color:#2C323D;padding:11px 13px;border:1px solid #CDD2DA;border-radius:8px;outline:none;margin-bottom:16px;\" style-focus=\"border-color:#1F7A4D;box-shadow:0 0 0 3px rgba(31,122,77,.18);\">\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#434B58;margin-bottom:6px;\">Contact <span style=\"color:#A8AFBB;font-weight:400;\">(email or phone)<\u002Fspan><\u002Flabel>\n            <input value=\"{{ fContact }}\" sc-camel-on-change=\"{{ setContact }}\" type=\"text\" placeholder=\"you@practice.com\" style=\"width:100%;font-family:'Inter',sans-serif;font-size:14.5px;color:#2C323D;padding:11px 13px;border:1px solid #CDD2DA;border-radius:8px;outline:none;margin-bottom:16px;\" style-focus=\"border-color:#1F7A4D;box-shadow:0 0 0 3px rgba(31,122,77,.18);\">\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#434B58;margin-bottom:6px;\">Tell us about your practice <span style=\"color:#A8AFBB;font-weight:400;\">(optional)<\u002Fspan><\u002Flabel>\n            <textarea value=\"{{ fNote }}\" sc-camel-on-change=\"{{ setNote }}\" rows=\"3\" placeholder=\"Specialty, size, what you'd like to see…\" style=\"width:100%;font-family:'Inter',sans-serif;font-size:14.5px;color:#2C323D;padding:11px 13px;border:1px solid #CDD2DA;border-radius:8px;outline:none;resize:vertical;margin-bottom:20px;\" style-focus=\"border-color:#1F7A4D;box-shadow:0 0 0 3px rgba(31,122,77,.18);\"><\u002Ftextarea>\n            <button type=\"submit\" style=\"width:100%;background:#1F7A4D;color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:14px;border:none;border-radius:8px;cursor:pointer;box-shadow:0 4px 12px rgba(31,122,77,.28);transition:background .2s;\" style-hover=\"background:#186040;\">Request my demo<\u002Fbutton>\n            <p style=\"font-size:11.5px;line-height:1.5;color:#A8AFBB;text-align:center;margin:14px 0 0;\">By submitting you agree to be contacted about Tibly. We never share your details.<\u002Fp>\n          <\u002Fform>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer style=\"background:#0A1839;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:52px 32px 40px;\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px;align-items:flex-start;\">\n      <div style=\"max-width:340px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <span style=\"width:30px;height:30px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:#0F2557;font-family:'EB Garamond',serif;font-weight:700;font-size:19px;\">T<\u002Fspan>\n          <span style=\"font-family:'EB Garamond',serif;font-weight:700;font-size:23px;color:#fff;\">Tibly<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.6;color:#8FA7D0;margin:16px 0 0;\">The clinical consultation and patient-records platform for specialist practices. Less paperwork, more time with patients.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:64px;flex-wrap:wrap;\">\n        <div>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6383B8;margin-bottom:14px;\">Platform<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:11px;\">\n            <a href=\"#product\" style=\"color:#DBE4F2;font-size:14px;\">Four pillars<\u002Fa>\n            <a href=\"#how\" style=\"color:#DBE4F2;font-size:14px;\">How it works<\u002Fa>\n            <a href=\"#doctors\" style=\"color:#DBE4F2;font-size:14px;\">For your practice<\u002Fa>\n            <a href=\"#faq\" style=\"color:#DBE4F2;font-size:14px;\">FAQ<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6383B8;margin-bottom:14px;\">Get started<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:11px;\">\n            <a href=\"#demo\" style=\"color:#DBE4F2;font-size:14px;\">Book a demo<\u002Fa>\n            <a href=\"mailto:hello@tibly.net\" style=\"color:#DBE4F2;font-size:14px;\">hello@tibly.net<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,.1);margin-top:40px;padding-top:22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;\">\n      <span style=\"font-size:12.5px;color:#6383B8;\">© {{ year }} Tibly · tibly.net<\u002Fspan>\n      <span style=\"font-size:12.5px;color:#6383B8;\">Private, login-only clinical platform<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;revealAnimations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;stickyNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;testimonialQuote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testimonial&quot;},&quot;testimonialName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testimonial&quot;},&quot;testimonialRole&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testimonial&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: 0, submitted: false, name: \"\", contact: \"\", note: \"\" };\n\n  componentDidMount() {\n    const scope = this.el || (typeof document !== \"undefined\" ? document : null);\n    if (!scope) return;\n    if (this.props.revealAnimations === false) {\n      Array.from(scope.querySelectorAll(\"[data-reveal]\")).forEach(e => e.classList.add(\"is-in\"));\n      return;\n    }\n    const els = Array.from(scope.querySelectorAll(\"[data-reveal]\"));\n    if (!(\"IntersectionObserver\" in window) || !els.length) {\n      els.forEach(e => e.classList.add(\"is-in\"));\n      return;\n    }\n    // stagger siblings gently by their DOM order within a grid/flex parent\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          const e = entry.target;\n          const sibs = e.parentElement ? Array.from(e.parentElement.children).filter(c => c.hasAttribute(\"data-reveal\")) : [e];\n          const i = Math.max(0, sibs.indexOf(e));\n          e.style.transitionDelay = (i * 80) + \"ms\";\n          e.classList.add(\"is-in\");\n          io.unobserve(e);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: \"0px 0px -8% 0px\" });\n    els.forEach(e => io.observe(e));\n  }\n\n  renderVals() {\n    const chevOpen = \"display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:8px;background:#EAF5EF;transition:transform .3s,background .3s;transform:rotate(180deg);\";\n    const chevClosed = \"display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:8px;background:#F7F8FA;transition:transform .3s,background .3s;transform:rotate(0deg);\";\n    const panelOpen = \"max-height:340px;opacity:1;overflow:hidden;transition:max-height .4s ease,opacity .3s ease .05s;\";\n    const panelClosed = \"max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .2s ease;\";\n\n    const ic = (p) => ({ __html: '<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' + p + '<\u002Fsvg>' });\n\n    const pillars = [\n      { title: \"Patient management & search\", icon: ic('<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m21 21-4.3-4.3\"/>'),\n        body: \"Find anyone in the list instantly, and create or edit records without friction.\",\n        points: [\"Fast search across your whole patient list\", \"Demographics, insurance, bio & occupation\", \"Structured social & medical history\"] },\n      { title: \"Patient profile & history\", icon: ic('<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>'),\n        body: \"One connected view of the patient — everything from every visit in a single place.\",\n        points: [\"Full history and every past consultation\", \"Vitals trends and prior investigations (echo)\", \"Carry context forward into a new visit\"] },\n      { title: \"Consultation workspace\", icon: ic('<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6\"/><path d=\"M9 13h6M9 17h4\"/>'),\n        body: \"Complaint, examination, vitals and plan — captured as fast as you can think.\",\n        points: [\"ECG, echo, ETT, pacemaker & vitals\", \"Reusable favorites and default values\", \"Drag-and-drop ordering + prefill\"] },\n      { title: \"Prescriptions & documents\", icon: ic('<rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M8 2v4M16 2v4M3 10h18\"/><path d=\"M9 15l2 2 4-4\"/>'),\n        body: \"Polished, print-ready paperwork generated straight from the visit.\",\n        points: [\"Rx grouped by clinical category, with defaults\", \"Test orders and results\", \"Certificates, claims, fee notes & summaries\"] },\n    ];\n\n    const steps = [\n      { n: \"1\", title: \"Intake\", body: \"Search or create the patient, capture demographics and history. Insurance and referrals are structured, not scribbled.\" },\n      { n: \"2\", title: \"Consult\", body: \"Record the complaint, examination and vitals, then build the plan — with favorites, defaults and prefill doing the typing.\" },\n      { n: \"3\", title: \"Documents\", body: \"Generate prescriptions, test orders, certificates and summaries in a click, ready to print or email — professionally laid out.\" },\n    ];\n\n    const benefits = [\n      { title: \"Your medicines, ready to go\", icon: ic('<path d=\"m9 11-6 6v3h9l3-3\"/><path d=\"m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4\"/>'), body: \"Tailor your own medicine lists with default morning / afternoon / night dosages and favorites.\" },\n      { title: \"Reorder everything\", icon: ic('<path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"/>'), body: \"Drag-and-drop ordering across medicine lists, history options and document layouts — it stays how you like it.\" },\n      { title: \"Prefill from the last visit\", icon: ic('<path d=\"M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.8L3 8\"/><path d=\"M3 3v5h5\"/>'), body: \"Bring relevant context forward so a follow-up starts with what matters already in place.\" },\n      { title: \"You control the output\", icon: ic('<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/>'), body: \"Decide what your PDFs say and how they look — prescriptions, claims, fee notes and certificates on your terms.\" },\n    ];\n\n    const faqData = [\n      { q: \"Is Tibly a public app patients can sign up for?\", a: \"No. Tibly is a private, login-only tool for a physician and clinic staff. It's built for running a practice, not a consumer-facing portal.\" },\n      { q: \"Is it only for cardiologists?\", a: \"Tibly is cardiology-focused out of the box — ECG, echo, exercise tolerance and pacemaker findings are first-class — but the medicine lists, history options and visit reasons are all yours to tailor, so it fits solo specialists and generalists too.\" },\n      { q: \"Can I use my own medicines, phrasing and templates?\", a: \"Yes. You tailor your own medicine lists with default dosages, your medical-history options and visit reasons, and you control document output — everything reorderable by drag-and-drop.\" },\n      { q: \"What documents can it produce?\", a: \"Prescriptions, test orders, medical certificates, insurance claims, fee notes and consultation summary emails — all generated from the visit and laid out professionally for printing.\" },\n      { q: \"How is my patient data handled?\", a: \"Access is login-only and private to your practice. We'll walk through exactly how your data is stored and handled during your demo.\" },\n    ];\n    const faqs = faqData.map((f, i) => ({\n      q: f.q, a: f.a,\n      toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),\n      iconStyle: this.state.open === i ? chevOpen : chevClosed,\n      panelStyle: this.state.open === i ? panelOpen : panelClosed,\n    }));\n\n    return {\n      rootClass: this.props.revealAnimations === false ? \"no-reveal\" : \"\",\n      navStyle: (this.props.stickyNav === false ? \"position:relative;\" : \"position:sticky;top:0;\")\n        + \"z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid #EFF1F4;\",\n      pillars, steps, benefits, faqs,\n      testimonial: {\n        quote: this.props.testimonialQuote || \"\\u201CTibly cut the admin around every consultation. By the time the patient leaves, the notes, prescription and summary are already done \\u2014 I get my afternoons back.\\u201D\",\n        name: this.props.testimonialName || \"Dr. [Name Placeholder]\",\n        role: this.props.testimonialRole || \"Consultant Cardiologist\",\n      },\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      fName: this.state.name, fContact: this.state.contact, fNote: this.state.note,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setContact: (e) => this.setState({ contact: e.target.value }),\n      setNote: (e) => this.setState({ note: e.target.value }),\n      onSubmit: (e) => { e.preventDefault(); this.setState({ submitted: true }); },\n      year: new Date().getFullYear(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
